name: Planner Android Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_BASE_URL: https://planner.datholding.ir/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Restore Gradle wrapper jar if missing
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f mobile/android/gradle/wrapper/gradle-wrapper.jar ]; then
            TMP="$(mktemp -d)"
            flutter create --platforms=android --org com.plannersuite --project-name planner_suite "$TMP/scaffold"
            mkdir -p mobile/android/gradle/wrapper
            cp "$TMP/scaffold/android/gradle/wrapper/gradle-wrapper.jar" mobile/android/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Configure Android SDK paths
        shell: bash
        run: |
          set -euxo pipefail
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > mobile/android/local.properties

      - name: Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze mobile app
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Build AAB
        working-directory: mobile
        run: flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: APK checksum
        shell: bash
        run: sha256sum mobile/build/app/outputs/flutter-apk/app-release.apk | tee APK-SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Planner-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Planner-Android-AAB
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: Planner-Android-SHA256
          path: APK-SHA256.txt
          if-no-files-found: error
          retention-days: 14
