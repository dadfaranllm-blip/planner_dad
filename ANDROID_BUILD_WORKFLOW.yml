name: Planner Android Build - Merged App
'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    env:
      API_BASE_URL: https://planner.datholding.ir/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          set -euxo pipefail
          flutter --version
          java -version

      - name: Verify merged mobile project
        run: |
          set -euxo pipefail
          test -f mobile/pubspec.yaml
          test -f mobile/lib/main.dart
          test -f mobile/lib/local_store.dart
          test -f mobile/lib/auth_store.dart
          test -f mobile/lib/sync_service.dart
          test -f mobile/lib/push_service.dart
          test -f mobile/lib/social_auth_service.dart
          test -f mobile/lib/voice_call_service.dart
          test -f mobile/android/app/src/main/AndroidManifest.xml

      - name: Restore missing Gradle wrapper jar
        run: |
          set -euxo pipefail
          if [ ! -f mobile/android/gradle/wrapper/gradle-wrapper.jar ]; then
            TMP_DIR="$(mktemp -d)"
            flutter create               --platforms=android               --org com.plannersuite               --project-name planner_suite               "$TMP_DIR/scaffold"
            mkdir -p mobile/android/gradle/wrapper
            cp "$TMP_DIR/scaffold/android/gradle/wrapper/gradle-wrapper.jar"                mobile/android/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Write Android local.properties
        run: |
          set -euxo pipefail
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > mobile/android/local.properties

      - name: Get mobile dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze mobile app only
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: mobile
        run: |
          set -euxo pipefail
          flutter build apk             --release             --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee mobile/APK-SHA256.txt

      - name: Build release AAB
        working-directory: mobile
        run: |
          set -euxo pipefail
          flutter build appbundle             --release             --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Planner-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Planner-Android-AAB
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: Planner-Android-SHA256
          path: mobile/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 14
