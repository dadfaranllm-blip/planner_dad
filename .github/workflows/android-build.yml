name: Planner Android Stable Signed Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      API_BASE_URL: https://planner.datholding.ir/api
      EXPECTED_VERSION: "1.7.0+19"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Verify requested source changes
        shell: bash
        run: |
          set -euxo pipefail

          test -f mobile/pubspec.yaml
          test -f mobile/lib/main.dart
          test -f mobile/android/app/build.gradle
          test -f mobile/android/app/src/main/kotlin/com/plannersuite/app/PlannerWidgetProvider.kt
          test -f mobile/android/app/src/main/res/layout/planner_widget.xml
          test -f mobile/android/app/src/main/res/layout/widget_row.xml

          ACTUAL="$(awk '/^version:/ {print $2}' mobile/pubspec.yaml | tr -d '\r')"
          test "$ACTUAL" = "$EXPECTED_VERSION"

          grep -q "نسخه ۱.۷.۰ (۱۹)" mobile/lib/main.dart
          grep -q "ویرایش کار" mobile/lib/main.dart
          grep -q "حذف کار" mobile/lib/main.dart
          grep -q "ویرایش رویداد" mobile/lib/main.dart
          grep -q "حذف رویداد" mobile/lib/main.dart
          grep -q "Jalali" mobile/lib/main.dart
          grep -q 'android:layoutDirection="rtl"' mobile/android/app/src/main/res/layout/planner_widget.xml
          grep -q 'android:textDirection="rtl"' mobile/android/app/src/main/res/layout/planner_widget.xml
          grep -q "gregorianToJalali" mobile/android/app/src/main/kotlin/com/plannersuite/app/PlannerWidgetProvider.kt

          echo "SOURCE VERIFICATION PASS"

      - name: Require stable Android signing secrets
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euxo pipefail

          test -n "$KS_B64"
          test -n "$KS_ALIAS"
          test -n "$KS_KEY_PASS"
          test -n "$KS_STORE_PASS"

          printf '%s' "$KS_B64" | base64 --decode > mobile/android/app/planner-release.jks

          cat > mobile/android/key.properties <<EOF
          storePassword=$KS_STORE_PASS
          keyPassword=$KS_KEY_PASS
          keyAlias=$KS_ALIAS
          storeFile=planner-release.jks
          EOF

          keytool -list \
            -keystore mobile/android/app/planner-release.jks \
            -storepass "$KS_STORE_PASS" \
            -alias "$KS_ALIAS" >/dev/null
