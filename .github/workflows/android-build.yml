name: Planner Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_BASE_URL: https://planner.datholding.ir/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Verify project
        run: |
          test -f mobile/pubspec.yaml
          test -f mobile/lib/main.dart
          flutter --version
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build Debug APK
        working-directory: mobile
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: planner-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
