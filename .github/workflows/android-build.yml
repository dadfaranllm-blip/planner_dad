name: Planner Android Build 1.6.0

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      EXPECTED_VERSION_NAME: "1.6.0"
      EXPECTED_VERSION_CODE: "18"
      API_BASE_URL: "https://planner.datholding.ir/api"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Verify source identity
        shell: bash
        run: |
          set -euxo pipefail
          flutter --version
          test "$(awk '/^version:/ {print $2}' pubspec.yaml | tr -d '\r')" = "${EXPECTED_VERSION_NAME}+${EXPECTED_VERSION_CODE}"
          grep -q "class SettingsPage" lib/main.dart
          grep -q "ویرایش مشارکتی" lib/main.dart
          grep -q "ساعت و تاریخ بزرگ" lib/main.dart
          grep -q "TextDirection.rtl" lib/main.dart
          grep -q "securityChannel" lib/main.dart
          grep -q "/auth/refresh" lib/main.dart
          grep -q "official-calendar" lib/main.dart
          grep -q "syncReminders" lib/main.dart
          grep -q "FilledButton.tonal(onPressed: goToday" lib/main.dart
          grep -q "chooseMonthYear" lib/main.dart
          grep -q "bottomNavigationBar: SafeArea" lib/main.dart
          grep -q "/auth/register/start" lib/main.dart
          grep -q "class ProfilePage" lib/main.dart
          grep -q "/typing" lib/main.dart
          echo "SOURCE IDENTITY OK: ${EXPECTED_VERSION_NAME}+${EXPECTED_VERSION_CODE}"

      - name: Generate clean Android host
        shell: bash
        run: |
          set -euxo pipefail
          TMP="$(mktemp -d)"
          flutter create \
            --platforms=android \
            --org com.plannersuite \
            --project-name planner_suite \
            "$TMP/scaffold"

          rm -rf android
          cp -R "$TMP/scaffold/android" android

          python3 tool/prepare_android.py android

          find android/app/src/main/res -type f -name 'ic_launcher*.xml' -delete || true

      - name: Verify Android integration
        shell: bash
        run: |
          set -euxo pipefail

          MANIFEST=android/app/src/main/AndroidManifest.xml

          for P in PlannerWidgetProvider PlannerClockWidgetProvider PlannerTasksWidgetProvider PlannerAgendaWidgetProvider; do
            grep -q "$P" "$MANIFEST"
          done

          for F in planner_widget_overview planner_widget_clock planner_widget_tasks planner_widget_agenda; do
            test -f "android/app/src/main/res/layout/${F}.xml"
            test -f "android/app/src/main/res/xml/${F}_info.xml"
          done

          grep -q 'usesCleartextTraffic="false"' "$MANIFEST"
          grep -q 'allowBackup="false"' "$MANIFEST"

          test -f android/app/src/main/res/xml/network_security_config.xml

          find android/app/src/main/kotlin -name SecureTokenStore.kt -print -quit | grep -q .
          grep -Rqs 'AndroidKeyStore' android/app/src/main/kotlin
          grep -Rqs 'AES/GCM/NoPadding' android/app/src/main/kotlin

          grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"
          grep -q 'PlannerReminderReceiver' "$MANIFEST"
          grep -q 'PlannerBootReceiver' "$MANIFEST"

          grep -Rqs 'planner_due_reminders' android/app/src/main/kotlin
          grep -Rqs 'setExactAndAllowWhileIdle' android/app/src/main/kotlin

          grep -Rqs 'layoutDirection="rtl"' android/app/src/main/res/layout/planner_widget_tasks.xml
          grep -Rqs 'textSize="24sp"' android/app/src/main/res/layout/planner_widget_tasks.xml

          test -f android/app/src/main/res/drawable/planner_widget_section_bg.xml

          echo "ANDROID INTEGRATION OK"

      - name: Normalize scaffold test
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('planner test environment is working', () {
              expect(true, isTrue);
            });
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze ROOT app only
        shell: bash
        run: |
          set -euxo pipefail
          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings \
            lib test

      - name: Test ROOT app only
        run: flutter test test

      - name: Build APK
        run: |
          set -euxo pipefail
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Verify FINAL APK
        shell: bash
        run: |
          set -euxo pipefail

          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"

          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2"

          "$AAPT2" dump badging "$APK" | tee final-apk-badging.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | tee final-apk-manifest.txt

          grep -q "versionName='${EXPECTED_VERSION_NAME}'" final-apk-badging.txt
          grep -q "versionCode='${EXPECTED_VERSION_CODE}'" final-apk-badging.txt
          grep -q "provides-component:'app-widget'" final-apk-badging.txt

          for P in PlannerWidgetProvider PlannerClockWidgetProvider PlannerTasksWidgetProvider PlannerAgendaWidgetProvider; do
            grep -q "$P" final-apk-manifest.txt
          done

          grep -q "android.appwidget.action.APPWIDGET_UPDATE" final-apk-manifest.txt
          grep -q "android.appwidget.provider" final-apk-manifest.txt
          grep -q "PlannerReminderReceiver" final-apk-manifest.txt
          grep -q "android.permission.POST_NOTIFICATIONS" final-apk-manifest.txt

          echo "FINAL APK VERIFICATION PASS"

      - name: Build AAB
        run: |
          set -euxo pipefail
          flutter build appbundle \
            --release \
            --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Checksums and report
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab \
            | tee SHA256SUMS.txt

          {
            echo "Planner Android ${EXPECTED_VERSION_NAME}+${EXPECTED_VERSION_CODE}"
            echo "Git commit: $GITHUB_SHA"
            echo "Build source: ROOT Flutter app"
            echo "Nested mobile/ project intentionally excluded from analysis"
            cat SHA256SUMS.txt
          } > BUILD-VERIFICATION.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Planner-Android-APK-1.6.0
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Planner-Android-AAB-1.6.0
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: Planner-Android-Verification-1.6.0
          path: |
            final-apk-badging.txt
            final-apk-manifest.txt
            SHA256SUMS.txt
            BUILD-VERIFICATION.txt
          if-no-files-found: error
          retention-days: 14
